<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        let bg_color_btn=document.createElement("button")
        bg_color_btn.innerHTML="changecolor"
        bg_color_btn.addEventListener("click",function(){
            document.body.style.backgroundColor="Pink"
        })
        document.body.appendChild(bg_color_btn)

    </script>
    
</body>
</html>
