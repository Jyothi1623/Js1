<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip the coin</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            align-content: center;
            flex-direction: column;
        }
        img{
            width: 200px;
            height: 220px;
        }
        button{
            height: 37px;
            width:99px;
            color: white;
            background-color: #d32c91;
            border-radius: 4px;
            border: 2px solid #d32c91 ;
            margin: 5px;
            cursor: pointer;

            

        }
    </style>
</head>
<body>
    <h1>Heads or Tails</h1>
    <p>Flip a virtual coin with this online and free app.</p>
    <img  id="coin_image" src="https://flipsimu.com/static/coin-image-big-b4e8096a3ec8ecc2b96d5998f19bda6c.png"> 
    <button onclick="Flipthecoin()">Flip the Coin</button>
    <audio id="coin_sound" src="coinflip.mp3"></audio>
    <script>
        function Flipthecoin(){
            let randon_num=Math.random()*100
            randon_num=Math.floor(randon_num)
            console.log(randon_num)
            let sound=document.getElementById("coin_sound")
            sound.play()
            
            let image_ele=document.getElementById("coin_image")
            if(randon_num%2==0){
                image_ele.src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ2GqRrYSImpgXmy2zrTc2YZLQAFBaaNuVv1AvoFhea-qzZvpqPJzwQH-4ar4saUKYkFYA&usqp=CAU"


            }else{
                image_ele.src="https://www.tossacoin.in/_next/image?url=%2Fhaids-tails.png&w=256&q=75"
            }

        }
    </script>
    
</body>
</html>
