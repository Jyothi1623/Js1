<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <textarea id="data" rows="25" cols="45"></textarea>
    <button onclick="sav_data()">save</button>
    <script>
        let ele=document.getElementById("data")
        let save_data=localStorage.getItem("data")
        ele.value=save_data
        function sav_data(){
            let ele=document.getElementById("data")
            localStorage.setItem("data",ele.value)

        }

    </script>
    
</body>
</html>
